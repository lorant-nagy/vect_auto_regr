[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vect-autoreg"
version = "0.2.0"
description = "Simulation of Gaussian vector autoregressive processes"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "pandas>=1.5",
  "pydantic>=1.10",
  "PyYAML>=6.0",
  "pyarrow>=10.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
vect-autoreg-generate = "vect_autoreg.generate:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
